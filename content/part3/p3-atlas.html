<section data-searchable="" id="p3-atlas"><h2>3부 · 63인 독립 육성 도감</h2><p>1부 등급과 후반 전망을 복사하지 않았습니다. ‘원문 종합’은 개별 공략의 종합 등급으로 <b>3부 전용 확정 티어가 아닙니다.</b> ‘핵심 후보’는 현재 역할별 편집 추천입니다.</p><div class="warn">외형 자료상 44명은 5년 후 모습이 바뀌고, 18명은 외형 불변 목록에 대응하며, 클라프카의 3부 전용 컷은 미확인입니다. 변경 44명만 별도 이미지를 넣었습니다. 나머지는 1부 이미지를 쓰지 않고 문자 자리표시자를 둡니다. 누락된 파일 아이콘이 아닙니다.</div><div class="atlas-toolbar"><input aria-label="3부 캐릭터 검색" id="p3-search" placeholder="3부 이름·일본어·병과·역할 검색" type="search"/><div class="atlas-filterline"><select aria-label="원문 종합 등급 필터" id="p3-rank"><option value="">모든 원문 등급</option><option>SS</option><option>S</option><option>A</option><option>B</option><option>C</option><option>D</option></select><label><input id="p3-core" type="checkbox"/>핵심 후보만</label><button id="p3-clear" type="button">필터 초기화</button></div></div><p aria-live="polite" class="status" id="p3-count">전체 63명</p><div class="portrait-grid" id="p3-board"><!--CHARACTERS3--></div></section>
