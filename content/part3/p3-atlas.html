<section data-searchable="" id="p3-atlas"><h2>3부 · 63인 독립 육성 도감</h2><p>1부 등급과 후반 전망을 복사하지 않았습니다. ‘원문 종합’은 개별 공략의 종합 등급으로 <b>3부 전용 확정 티어가 아닙니다.</b> ‘핵심 후보’는 현재 역할별 편집 추천입니다.</p><div class="warn">외형이 바뀌는 44명은 3부 전용 초상화를, 외형이 같은 18명은 1부와 동일한 기본 초상화를 표시합니다. 평가·직업·세팅 정보는 이미지와 관계없이 3부 자료로 분리되어 있습니다. 클라프카는 3부 외형을 확인하지 못해 ‘이미지 미확인’으로 남겼습니다.</div><div class="atlas-toolbar"><input aria-label="3부 캐릭터 검색" id="p3-search" placeholder="3부 이름·일본어·병과·역할 검색" type="search"/><div class="atlas-filterline"><select aria-label="원문 종합 등급 필터" id="p3-rank"><option value="">모든 원문 등급</option><option>SS</option><option>S</option><option>A</option><option>B</option><option>C</option><option>D</option></select><label><input id="p3-core" type="checkbox"/>핵심 후보만</label><button id="p3-clear" type="button">필터 초기화</button></div></div><p aria-live="polite" class="status" id="p3-count">전체 63명</p><div class="portrait-grid" id="p3-board"><!--CHARACTERS3--></div></section>
